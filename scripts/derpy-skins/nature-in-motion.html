<!doctype html>
<!--
  The Nature in Motion skin pack for the Derp Store (SITE r22): five
  1024×1024 territory skins drawn with the canvas 2D API, each played with a
  motion by the territory shader in game (packages/shared/DerpySkinMotion.ts:
  lava and the northern lights ripple, fireflies twinkle, clouds drift, and a
  gleam sweeps over the honeycomb). Open this file in a browser and save each
  skin from its link, or call window.renderSkins(), which returns
  { name: dataURL }; the committed PNGs were then cut to a 256-colour palette
  as the Astral Armada's were (see astral-armada.html).

  Every skin tiles seamlessly (the motions keep it so: drift moves by whole
  REPEATs, ripple and twinkle are local). For the twinkle, everything but
  the fireflies is kept dark, since the shader pulses only bright pixels.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nature in Motion skins</title>
    <style>
      body {
        background: #111;
        color: #eee;
        font:
          14px system-ui,
          sans-serif;
        margin: 16px;
      }
      figure {
        display: inline-block;
        margin: 8px;
      }
      canvas {
        width: 256px;
        height: 256px;
        display: block;
      }
      a {
        color: #9cf;
      }
    </style>
  </head>
  <body>
    <div id="out"></div>
    <script>
      // The drawing kit the three r22 packs share (each page has its own
      // copy): every skin is a 1024×1024 tile that repeats across a
      // territory, so whatever crosses an edge is drawn again on the far side
      // (wrapped), and noise and scatter are periodic on the 1024 torus.
      const S = 1024;

      /** A seeded random stream in [0, 1). */
      function rng(seed) {
        return () => {
          seed = (seed + 0x6d2b79f5) >>> 0;
          let t = seed;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      /** Draw `fn` at (x, y), and again at every copy across an edge. */
      function wrapped(ctx, x, y, r, fn) {
        for (const dx of [-S, 0, S]) {
          for (const dy of [-S, 0, S]) {
            const cx = x + dx;
            const cy = y + dy;
            if (cx + r < 0 || cx - r > S || cy + r < 0 || cy - r > S) continue;
            ctx.save();
            ctx.translate(cx, cy);
            fn(ctx);
            ctx.restore();
          }
        }
      }

      /** Points spread over the torus, no two closer than `min` (dart throwing). */
      function scatter(rand, count, min, tries = 60) {
        const pts = [];
        for (let i = 0; i < count; i++) {
          for (let k = 0; k < tries; k++) {
            const x = rand() * S;
            const y = rand() * S;
            if (pts.every((p) => torusDist(p.x, p.y, x, y) >= min)) {
              pts.push({ x, y });
              break;
            }
          }
        }
        return pts;
      }

      function torusDist(ax, ay, bx, by) {
        let dx = Math.abs(ax - bx);
        let dy = Math.abs(ay - by);
        if (dx > S / 2) dx = S - dx;
        if (dy > S / 2) dy = S - dy;
        return Math.hypot(dx, dy);
      }

      /** Periodic value noise on the torus, several octaves (cells per side each). */
      function tileNoise(rand, octaves, falloff = 0.55) {
        const layers = octaves.map((cells) => {
          const v = new Float32Array(cells * cells);
          for (let i = 0; i < v.length; i++) v[i] = rand();
          return { cells, v };
        });
        const smooth = (t) => t * t * t * (t * (t * 6 - 15) + 10);
        return (x, y) => {
          let sum = 0;
          let amp = 1;
          let norm = 0;
          for (const { cells, v } of layers) {
            const gx = (x / S) * cells;
            const gy = (y / S) * cells;
            const ix = Math.floor(gx);
            const iy = Math.floor(gy);
            const fx = smooth(gx - ix);
            const fy = smooth(gy - iy);
            const x0 = ((ix % cells) + cells) % cells;
            const y0 = ((iy % cells) + cells) % cells;
            const x1 = (x0 + 1) % cells;
            const y1 = (y0 + 1) % cells;
            const a = v[y0 * cells + x0];
            const b = v[y0 * cells + x1];
            const c = v[y1 * cells + x0];
            const d = v[y1 * cells + x1];
            const top = a + (b - a) * fx;
            const bot = c + (d - c) * fx;
            sum += (top + (bot - top) * fy) * amp;
            norm += amp;
            amp *= falloff;
          }
          return sum / norm;
        };
      }

      function hex(c) {
        return [
          parseInt(c.slice(1, 3), 16),
          parseInt(c.slice(3, 5), 16),
          parseInt(c.slice(5, 7), 16),
        ];
      }

      function mix3(a, b, t) {
        return [
          a[0] + (b[0] - a[0]) * t,
          a[1] + (b[1] - a[1]) * t,
          a[2] + (b[2] - a[2]) * t,
        ];
      }

      /** A colour ramp: stops [[t, "#rrggbb"], ...] → (t) => [r, g, b]. */
      function ramp(stops) {
        const s = stops.map(([t, c]) => [t, hex(c)]);
        return (t) => {
          if (t <= s[0][0]) return s[0][1];
          for (let i = 1; i < s.length; i++) {
            if (t <= s[i][0]) {
              const k = (t - s[i - 1][0]) / (s[i][0] - s[i - 1][0]);
              return mix3(s[i - 1][1], s[i][1], k);
            }
          }
          return s[s.length - 1][1];
        };
      }

      /** Paint every pixel from `fn(x, y) → [r, g, b]`. */
      function paintPixels(ctx, fn) {
        const img = ctx.createImageData(S, S);
        const d = img.data;
        for (let y = 0; y < S; y++) {
          for (let x = 0; x < S; x++) {
            const c = fn(x, y);
            const p = (y * S + x) * 4;
            d[p] = c[0];
            d[p + 1] = c[1];
            d[p + 2] = c[2];
            d[p + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
      }

      /** A soft radial glow. */
      function glow(ctx, x, y, r, color, alpha = 1) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, color);
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.globalAlpha = alpha;
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      function stroke(ctx, color, w) {
        ctx.lineWidth = w;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.strokeStyle = color;
        ctx.stroke();
      }

      /** Renders every skin in `skins` ({ name: paint(ctx) }), shows them, returns data URLs. */
      function renderAll(skins) {
        const out = {};
        const host = document.getElementById("out");
        host.innerHTML = "";
        for (const [name, paint] of Object.entries(skins)) {
          const canvas = document.createElement("canvas");
          canvas.width = S;
          canvas.height = S;
          const ctx = canvas.getContext("2d");
          paint(ctx);
          out[name] = canvas.toDataURL("image/png");
          const fig = document.createElement("figure");
          const a = document.createElement("a");
          a.href = out[name];
          a.download = `${name}.png`;
          a.textContent = `${name}.png`;
          fig.append(canvas, a);
          host.append(fig);
        }
        return out;
      }
    </script>
    <script>
      const smoothstep = (a, b, x) => {
        const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
        return t * t * (3 - 2 * t);
      };

      // ----------------------------------------------------------------- lava

      function paintLava(ctx) {
        const crack = tileNoise(rng(501), [4, 8, 16, 32], 0.5);
        const crack2 = tileNoise(rng(502), [8, 16, 32, 64], 0.5);
        const pools = tileNoise(rng(503), [6, 12, 24], 0.55);
        const rock = tileNoise(rng(504), [16, 32, 64, 128], 0.6);
        const molten = ramp([
          [0, "#4a0800"],
          [0.35, "#b81f06"],
          [0.65, "#ff6a00"],
          [0.85, "#ffb21f"],
          [1, "#fff1a6"],
        ]);
        const crust = ramp([
          [0, "#120c0b"],
          [0.5, "#261a17"],
          [1, "#3c2b25"],
        ]);
        paintPixels(ctx, (x, y) => {
          const r1 = 1 - Math.abs(2 * crack(x, y) - 1);
          const r2 = 1 - Math.abs(2 * crack2(x, y) - 1);
          const ridge = Math.max(r1, r2 * 0.93);
          const pool = smoothstep(0.75, 0.81, pools(x, y));
          const heat = Math.max(
            smoothstep(0.86, 0.985, ridge),
            pool * (0.75 + 0.25 * rock(x, y)),
          );
          const base = crust(rock(x, y));
          // Crust glows a little near the cracks.
          const near = smoothstep(0.62, 0.9, ridge) * 0.55 + pool * 0.3;
          const warm = mix3(base, [150, 40, 8], near * 0.45);
          return mix3(warm, molten(heat), Math.min(1, heat * 1.25));
        });
      }

      // --------------------------------------------------- northern lights

      function paintAurora(ctx) {
        const sky = tileNoise(rng(511), [2, 4, 8], 0.6);
        // Rays: noise across the curtain (sampled along one row, so it varies
        // with x only), stirred a little by a slow noise over the whole sky.
        const rayNoise = tileNoise(rng(512), [32, 64, 128], 0.5);
        const stir = tileNoise(rng(514), [2, 4], 0.6);
        const rays = (x, y) => 0.7 * rayNoise(x, 0) + 0.3 * stir(x, y);
        const skyRamp = ramp([
          [0, "#050a1c"],
          [1, "#14204a"],
        ]);
        const curtain = ramp([
          [0, "#5dffb0"],
          [0.3, "#22d69a"],
          [0.55, "#3aa4ff"],
          [0.8, "#9b5cff"],
          [1, "#e070ff"],
        ]);
        const TAU = Math.PI * 2;
        const bands = [
          { y: 250, k1: 2, k2: 5, p1: 0.3, p2: 1.7, a1: 70, a2: 22, h: 250 },
          { y: 590, k1: 3, k2: 7, p1: 2.1, p2: 0.4, a1: 55, a2: 18, h: 210 },
          { y: 930, k1: 1, k2: 4, p1: 4.0, p2: 2.6, a1: 80, a2: 25, h: 240 },
        ];
        paintPixels(ctx, (x, y) => {
          let c = skyRamp(sky(x, y));
          for (const b of bands) {
            const yc =
              b.y +
              b.a1 * Math.sin((TAU * x * b.k1) / S + b.p1) +
              b.a2 * Math.sin((TAU * x * b.k2) / S + b.p2);
            // Height above the curtain's bright lower edge, on the torus.
            let dy = (yc - y) % S;
            if (dy < -S / 2) dy += S;
            if (dy > S / 2) dy -= S;
            let k;
            if (dy >= 0) {
              const t = dy / b.h;
              k = t > 1.2 ? 0 : Math.exp(-t * 1.9) * (0.35 + 0.9 * rays(x, y));
            } else {
              k = Math.exp(dy * 0.09) * 0.9;
            }
            if (k > 0.002) {
              const col = curtain(Math.min(1, Math.max(0, dy) / b.h));
              c = mix3(c, col, Math.min(0.92, k));
            }
          }
          return c;
        });
        const rand = rng(513);
        for (let i = 0; i < 420; i++) {
          const x = rand() * S;
          const y = rand() * S;
          const big = rand() > 0.96;
          const r = big ? 2.2 : 0.6 + rand() * 0.9;
          const a = 0.35 + rand() * 0.6;
          wrapped(ctx, x, y, 8, (c) => {
            if (big) glow(c, 0, 0, 7, "rgba(220,235,255,0.5)");
            c.globalAlpha = a;
            c.fillStyle = "#ffffff";
            c.beginPath();
            c.arc(0, 0, r, 0, Math.PI * 2);
            c.fill();
            c.globalAlpha = 1;
          });
        }
      }

      // ------------------------------------------------------------ fireflies

      function blade(c, h, lean, w, col) {
        c.beginPath();
        c.moveTo(-w, 0);
        c.quadraticCurveTo(lean * 0.4, -h * 0.6, lean, -h);
        c.quadraticCurveTo(lean * 0.4 + w * 0.3, -h * 0.55, w, 0);
        c.closePath();
        c.fillStyle = col;
        c.fill();
      }

      function paintFireflies(ctx) {
        const n = tileNoise(rng(521), [4, 8, 16, 32]);
        const night = ramp([
          [0, "#07130f"],
          [1, "#10261d"],
        ]);
        paintPixels(ctx, (x, y) => night(n(x, y)));
        const rand = rng(522);
        // Clumps of meadow grass, back (darker) to front.
        const greens = ["#0f2a1e", "#143526", "#1a412e", "#1f4b34"];
        for (let layer = 0; layer < greens.length; layer++) {
          for (let i = 0; i < 70; i++) {
            const x = rand() * S;
            const y = rand() * S;
            const blades = Array.from(
              { length: 7 + Math.floor(rand() * 7) },
              () => ({
                dx: (rand() - 0.5) * 34,
                h: 26 + rand() * 46,
                lean: (rand() - 0.5) * 40,
                w: 2 + rand() * 2.5,
              }),
            );
            wrapped(ctx, x, y, 80, (c) => {
              for (const b of blades) {
                c.save();
                c.translate(b.dx, 0);
                blade(c, b.h, b.lean, b.w, greens[layer]);
                c.restore();
              }
            });
          }
        }
        // A few seed heads and dim flowers in the dark.
        for (let i = 0; i < 60; i++) {
          const x = rand() * S;
          const y = rand() * S;
          wrapped(ctx, x, y, 6, (c) => {
            c.fillStyle = "#2c4a3a";
            c.beginPath();
            c.arc(0, 0, 3, 0, Math.PI * 2);
            c.fill();
          });
        }
        // The fireflies.
        for (const p of scatter(rand, 190, 42)) {
          const r = 3 + rand() * 2.4;
          const halo = 16 + rand() * 14;
          wrapped(ctx, p.x, p.y, halo, (c) => {
            glow(c, 0, 0, halo, "rgba(190,255,80,0.42)");
            glow(c, 0, 0, halo * 0.45, "rgba(225,255,140,0.7)");
            c.fillStyle = "#fbffc4";
            c.beginPath();
            c.arc(0, 0, r, 0, Math.PI * 2);
            c.fill();
          });
        }
      }

      // --------------------------------------------------------------- clouds

      function cloud(c, w, rand) {
        const puffs = [];
        const n = 5 + Math.floor(rand() * 3);
        for (let i = 0; i < n; i++) {
          const t = i / (n - 1);
          const r =
            w * (0.16 + 0.12 * Math.sin(t * Math.PI)) * (0.85 + rand() * 0.3);
          puffs.push({
            x: (t - 0.5) * w * 0.82,
            y: -r * 0.55 - Math.sin(t * Math.PI) * w * 0.08,
            r,
          });
        }
        const body = (dx, dy) => {
          c.beginPath();
          for (const p of puffs) {
            c.moveTo(p.x + dx + p.r, p.y + dy);
            c.arc(p.x + dx, p.y + dy, p.r, 0, Math.PI * 2);
          }
          c.roundRect(
            -w * 0.48 + dx,
            -w * 0.12 + dy,
            w * 0.96,
            w * 0.14,
            w * 0.07,
          );
        };
        body(0, w * 0.035);
        c.fillStyle = "#b9d5ee";
        c.fill();
        body(0, 0);
        c.fillStyle = "#ffffff";
        c.fill();
        // Shade on the underside, light on top.
        c.save();
        body(0, 0);
        c.clip();
        const g = c.createLinearGradient(0, -w * 0.45, 0, w * 0.04);
        g.addColorStop(0, "rgba(255,255,255,0)");
        g.addColorStop(0.7, "rgba(214,230,246,0)");
        g.addColorStop(1, "rgba(196,219,242,0.9)");
        c.fillStyle = g;
        c.fillRect(-w, -w, w * 2, w * 2);
        c.restore();
      }

      function paintClouds(ctx) {
        const n = tileNoise(rng(531), [2, 4, 8]);
        const sky = ramp([
          [0, "#6fb8f0"],
          [1, "#a3d6fb"],
        ]);
        paintPixels(ctx, (x, y) => sky(n(x, y)));
        const rand = rng(532);
        for (const p of scatter(rand, 16, 210)) {
          const w = 150 + rand() * 140;
          const seed = Math.floor(rand() * 1e9);
          wrapped(ctx, p.x, p.y, w * 0.6, (c) => cloud(c, w, rng(seed)));
        }
        // A few birds far off.
        for (let i = 0; i < 9; i++) {
          const x = rand() * S;
          const y = rand() * S;
          const s = 6 + rand() * 5;
          wrapped(ctx, x, y, s * 2, (c) => {
            c.beginPath();
            c.moveTo(-s, -s * 0.2);
            c.quadraticCurveTo(-s * 0.5, -s * 0.7, 0, 0);
            c.quadraticCurveTo(s * 0.5, -s * 0.7, s, -s * 0.2);
            stroke(c, "#3c5a78", 2);
          });
        }
      }

      // ------------------------------------------------------------ honeycomb

      function paintHoneycomb(ctx) {
        // Pointy-topped cells: 12 across, 14 rows (every other row shifted
        // half a cell), squashed by 1% so they meet at the seams.
        const cols = 12;
        const rows = 14;
        const w = S / cols;
        const size = w / Math.sqrt(3);
        const rowH = S / rows;
        const ky = rowH / (1.5 * size);
        ctx.fillStyle = "#7a4a08";
        ctx.fillRect(0, 0, S, S);
        const rand = rng(541);
        const hexPath = (c, r) => {
          c.beginPath();
          for (let k = 0; k < 6; k++) {
            const a = Math.PI / 6 + (k / 6) * Math.PI * 2;
            const px = Math.cos(a) * r;
            const py = Math.sin(a) * r * ky;
            if (k === 0) c.moveTo(px, py);
            else c.lineTo(px, py);
          }
          c.closePath();
        };
        for (let j = 0; j < rows; j++) {
          for (let i = 0; i < cols; i++) {
            const x = i * w + (j % 2) * (w / 2);
            const y = j * rowH;
            const kind = rand();
            const shade = rand();
            wrapped(ctx, x, y, size + 4, (c) => {
              // The wax wall.
              hexPath(c, size);
              c.fillStyle = "#e7ad45";
              c.fill();
              stroke(c, "#9c6a12", 2);
              hexPath(c, size - 7);
              if (kind < 0.18) {
                // A capped cell: pale wax with a little texture.
                c.fillStyle = "#f4d98c";
                c.fill();
                c.beginPath();
                c.arc(-6, -5, size * 0.35, 0, Math.PI * 2);
                c.fillStyle = "rgba(255,255,255,0.35)";
                c.fill();
              } else if (kind < 0.27) {
                // Empty: a dark well.
                const g = c.createRadialGradient(0, 0, 2, 0, 0, size);
                g.addColorStop(0, "#5a3205");
                g.addColorStop(1, "#8d5a12");
                c.fillStyle = g;
                c.fill();
              } else {
                // Full of honey, lit from within.
                const g = c.createRadialGradient(
                  -size * 0.2,
                  -size * 0.25,
                  2,
                  0,
                  0,
                  size,
                );
                g.addColorStop(0, "#ffe27a");
                g.addColorStop(0.45, shade < 0.5 ? "#ffb81c" : "#ffa708");
                g.addColorStop(1, "#c76f00");
                c.fillStyle = g;
                c.fill();
                c.beginPath();
                c.ellipse(
                  -size * 0.28,
                  -size * 0.32,
                  size * 0.22,
                  size * 0.09,
                  -0.6,
                  0,
                  Math.PI * 2,
                );
                c.fillStyle = "rgba(255,255,255,0.75)";
                c.fill();
              }
            });
          }
        }
      }

      const SKINS = {
        motion_lava: paintLava,
        motion_aurora: paintAurora,
        motion_fireflies: paintFireflies,
        motion_clouds: paintClouds,
        motion_honey: paintHoneycomb,
      };

      window.renderSkins = () => renderAll(SKINS);
      window.renderSkins();
    </script>
  </body>
</html>
