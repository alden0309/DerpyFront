<!doctype html>
<!--
  The Sweet Shop skin pack for the Derp Store (SITE r22): five 1024×1024
  territory skins drawn with the canvas 2D API. Open this file in a browser
  and save each skin from its link, or call window.renderSkins(), which
  returns { name: dataURL }; the committed PNGs were then cut to a 256-colour
  palette as the Astral Armada's were (see astral-armada.html).

  Every skin tiles seamlessly. All original: plain sweets, no brands.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sweet Shop skins</title>
    <style>
      body {
        background: #111;
        color: #eee;
        font:
          14px system-ui,
          sans-serif;
        margin: 16px;
      }
      figure {
        display: inline-block;
        margin: 8px;
      }
      canvas {
        width: 256px;
        height: 256px;
        display: block;
      }
      a {
        color: #9cf;
      }
    </style>
  </head>
  <body>
    <div id="out"></div>
    <script>
      // The drawing kit the three r22 packs share (each page has its own
      // copy): every skin is a 1024×1024 tile that repeats across a
      // territory, so whatever crosses an edge is drawn again on the far side
      // (wrapped), and noise and scatter are periodic on the 1024 torus.
      const S = 1024;

      /** A seeded random stream in [0, 1). */
      function rng(seed) {
        return () => {
          seed = (seed + 0x6d2b79f5) >>> 0;
          let t = seed;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      /** Draw `fn` at (x, y), and again at every copy across an edge. */
      function wrapped(ctx, x, y, r, fn) {
        for (const dx of [-S, 0, S]) {
          for (const dy of [-S, 0, S]) {
            const cx = x + dx;
            const cy = y + dy;
            if (cx + r < 0 || cx - r > S || cy + r < 0 || cy - r > S) continue;
            ctx.save();
            ctx.translate(cx, cy);
            fn(ctx);
            ctx.restore();
          }
        }
      }

      /** Points spread over the torus, no two closer than `min` (dart throwing). */
      function scatter(rand, count, min, tries = 60) {
        const pts = [];
        for (let i = 0; i < count; i++) {
          for (let k = 0; k < tries; k++) {
            const x = rand() * S;
            const y = rand() * S;
            if (pts.every((p) => torusDist(p.x, p.y, x, y) >= min)) {
              pts.push({ x, y });
              break;
            }
          }
        }
        return pts;
      }

      function torusDist(ax, ay, bx, by) {
        let dx = Math.abs(ax - bx);
        let dy = Math.abs(ay - by);
        if (dx > S / 2) dx = S - dx;
        if (dy > S / 2) dy = S - dy;
        return Math.hypot(dx, dy);
      }

      /** Periodic value noise on the torus, several octaves (cells per side each). */
      function tileNoise(rand, octaves, falloff = 0.55) {
        const layers = octaves.map((cells) => {
          const v = new Float32Array(cells * cells);
          for (let i = 0; i < v.length; i++) v[i] = rand();
          return { cells, v };
        });
        const smooth = (t) => t * t * t * (t * (t * 6 - 15) + 10);
        return (x, y) => {
          let sum = 0;
          let amp = 1;
          let norm = 0;
          for (const { cells, v } of layers) {
            const gx = (x / S) * cells;
            const gy = (y / S) * cells;
            const ix = Math.floor(gx);
            const iy = Math.floor(gy);
            const fx = smooth(gx - ix);
            const fy = smooth(gy - iy);
            const x0 = ((ix % cells) + cells) % cells;
            const y0 = ((iy % cells) + cells) % cells;
            const x1 = (x0 + 1) % cells;
            const y1 = (y0 + 1) % cells;
            const a = v[y0 * cells + x0];
            const b = v[y0 * cells + x1];
            const c = v[y1 * cells + x0];
            const d = v[y1 * cells + x1];
            const top = a + (b - a) * fx;
            const bot = c + (d - c) * fx;
            sum += (top + (bot - top) * fy) * amp;
            norm += amp;
            amp *= falloff;
          }
          return sum / norm;
        };
      }

      function hex(c) {
        return [
          parseInt(c.slice(1, 3), 16),
          parseInt(c.slice(3, 5), 16),
          parseInt(c.slice(5, 7), 16),
        ];
      }

      function mix3(a, b, t) {
        return [
          a[0] + (b[0] - a[0]) * t,
          a[1] + (b[1] - a[1]) * t,
          a[2] + (b[2] - a[2]) * t,
        ];
      }

      /** A colour ramp: stops [[t, "#rrggbb"], ...] → (t) => [r, g, b]. */
      function ramp(stops) {
        const s = stops.map(([t, c]) => [t, hex(c)]);
        return (t) => {
          if (t <= s[0][0]) return s[0][1];
          for (let i = 1; i < s.length; i++) {
            if (t <= s[i][0]) {
              const k = (t - s[i - 1][0]) / (s[i][0] - s[i - 1][0]);
              return mix3(s[i - 1][1], s[i][1], k);
            }
          }
          return s[s.length - 1][1];
        };
      }

      /** Paint every pixel from `fn(x, y) → [r, g, b]`. */
      function paintPixels(ctx, fn) {
        const img = ctx.createImageData(S, S);
        const d = img.data;
        for (let y = 0; y < S; y++) {
          for (let x = 0; x < S; x++) {
            const c = fn(x, y);
            const p = (y * S + x) * 4;
            d[p] = c[0];
            d[p + 1] = c[1];
            d[p + 2] = c[2];
            d[p + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
      }

      /** A soft radial glow. */
      function glow(ctx, x, y, r, color, alpha = 1) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, color);
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.globalAlpha = alpha;
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      function stroke(ctx, color, w) {
        ctx.lineWidth = w;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.strokeStyle = color;
        ctx.stroke();
      }

      /** Renders every skin in `skins` ({ name: paint(ctx) }), shows them, returns data URLs. */
      function renderAll(skins) {
        const out = {};
        const host = document.getElementById("out");
        host.innerHTML = "";
        for (const [name, paint] of Object.entries(skins)) {
          const canvas = document.createElement("canvas");
          canvas.width = S;
          canvas.height = S;
          const ctx = canvas.getContext("2d");
          paint(ctx);
          out[name] = canvas.toDataURL("image/png");
          const fig = document.createElement("figure");
          const a = document.createElement("a");
          a.href = out[name];
          a.download = `${name}.png`;
          a.textContent = `${name}.png`;
          fig.append(canvas, a);
          host.append(fig);
        }
        return out;
      }
    </script>
    <script>
      const INK = "#4a2330";

      // ---------------------------------------------------------- peppermints

      function peppermint(c, r, rot) {
        // Cellophane twists either side.
        c.save();
        c.rotate(rot);
        for (const side of [-1, 1]) {
          c.beginPath();
          c.moveTo(side * r * 0.82, -r * 0.22);
          c.quadraticCurveTo(
            side * r * 1.25,
            -r * 0.1,
            side * r * 1.62,
            -r * 0.5,
          );
          c.lineTo(side * r * 1.55, r * 0.48);
          c.quadraticCurveTo(
            side * r * 1.25,
            r * 0.1,
            side * r * 0.82,
            r * 0.22,
          );
          c.closePath();
          c.fillStyle = "rgba(255,255,255,0.72)";
          c.fill();
          stroke(c, "rgba(74,35,48,0.55)", 3);
          c.beginPath();
          c.moveTo(side * r * 1.08, -r * 0.18);
          c.lineTo(side * r * 1.42, -r * 0.34);
          stroke(c, "rgba(255,255,255,0.95)", 3);
        }
        // The sweet: eight swirled stripes.
        c.beginPath();
        c.arc(0, 0, r, 0, Math.PI * 2);
        c.fillStyle = "#fffaf5";
        c.fill();
        for (let k = 0; k < 8; k += 2) {
          const a0 = (k / 8) * Math.PI * 2;
          const a1 = ((k + 1) / 8) * Math.PI * 2;
          c.beginPath();
          c.moveTo(0, 0);
          c.quadraticCurveTo(
            Math.cos(a0 + 0.55) * r * 0.55,
            Math.sin(a0 + 0.55) * r * 0.55,
            Math.cos(a0) * r,
            Math.sin(a0) * r,
          );
          c.arc(0, 0, r, a0, a1);
          c.quadraticCurveTo(
            Math.cos(a1 + 0.55) * r * 0.55,
            Math.sin(a1 + 0.55) * r * 0.55,
            0,
            0,
          );
          c.fillStyle = "#e3263b";
          c.fill();
        }
        c.beginPath();
        c.arc(0, 0, r, 0, Math.PI * 2);
        stroke(c, INK, 4);
        // A shine.
        c.beginPath();
        c.ellipse(
          -r * 0.35,
          -r * 0.42,
          r * 0.32,
          r * 0.13,
          -0.6,
          0,
          Math.PI * 2,
        );
        c.fillStyle = "rgba(255,255,255,0.75)";
        c.fill();
        c.restore();
      }

      function paintPeppermints(ctx) {
        ctx.fillStyle = "#bdebd7";
        ctx.fillRect(0, 0, S, S);
        // Faint mint pinstripes, 16 to the tile.
        ctx.strokeStyle = "rgba(255,255,255,0.45)";
        ctx.lineWidth = 6;
        for (let i = -16; i < 32; i++) {
          ctx.beginPath();
          ctx.moveTo(i * 64, 0);
          ctx.lineTo(i * 64 + S, S);
          ctx.stroke();
        }
        const rand = rng(301);
        for (const p of scatter(rand, 34, 150)) {
          const r = 40 + rand() * 12;
          const rot = rand() * Math.PI;
          wrapped(ctx, p.x, p.y, r * 1.7, (c) => peppermint(c, r, rot));
        }
      }

      // ------------------------------------------------------------ sprinkles

      const SPRINKLE = [
        "#ff4d6d",
        "#ffd23f",
        "#3ec1d3",
        "#7bd389",
        "#ffffff",
        "#a06cd5",
        "#ff9f1c",
      ];

      function paintSprinkles(ctx) {
        const n = tileNoise(rng(310), [4, 8, 16]);
        const base = ramp([
          [0, "#f58fb4"],
          [1, "#fbbfd4"],
        ]);
        paintPixels(ctx, (x, y) => base(n(x, y)));
        const rand = rng(311);
        for (let i = 0; i < 1500; i++) {
          const x = rand() * S;
          const y = rand() * S;
          const col = SPRINKLE[Math.floor(rand() * SPRINKLE.length)];
          const round = rand() < 0.12;
          const a = rand() * Math.PI;
          wrapped(ctx, x, y, 14, (c) => {
            c.rotate(a);
            if (round) {
              c.beginPath();
              c.arc(0, 0, 4.5, 0, Math.PI * 2);
              c.fillStyle = col;
              c.fill();
              return;
            }
            c.beginPath();
            c.roundRect(-10, -3.4, 20, 6.8, 3.4);
            c.fillStyle = "rgba(120,40,70,0.25)";
            c.translate(1.5, 2);
            c.fill();
            c.translate(-1.5, -2);
            c.fillStyle = col;
            c.fill();
            c.beginPath();
            c.roundRect(-7, -2.2, 10, 1.6, 0.8);
            c.fillStyle = "rgba(255,255,255,0.55)";
            c.fill();
          });
        }
      }

      // --------------------------------------------------------------- donuts

      const ICING = [
        ["#ff8fb1", "#ffc2d4"],
        ["#6b3e26", "#93604a"],
        ["#fff1d6", "#ffffff"],
        ["#8fd3ff", "#c4e9ff"],
        ["#c59bff", "#e0c8ff"],
      ];

      function donut(c, r, icing, rand) {
        // Shadow, dough, icing with a wavy edge, the hole.
        c.beginPath();
        c.arc(4, 6, r, 0, Math.PI * 2);
        c.fillStyle = "rgba(40,60,100,0.18)";
        c.fill();
        c.beginPath();
        c.arc(0, 0, r, 0, Math.PI * 2);
        c.fillStyle = "#d9944f";
        c.fill();
        c.beginPath();
        c.arc(0, -2, r * 0.94, 0, Math.PI * 2);
        c.fillStyle = "#e8b277";
        c.fill();
        c.beginPath();
        const waves = 9;
        for (let i = 0; i <= 72; i++) {
          const a = (i / 72) * Math.PI * 2;
          const rr =
            r * (0.8 + 0.06 * Math.sin(a * waves) + 0.03 * Math.sin(a * 3 + 1));
          const x = Math.cos(a) * rr;
          const y = Math.sin(a) * rr - 3;
          if (i === 0) c.moveTo(x, y);
          else c.lineTo(x, y);
        }
        c.closePath();
        c.fillStyle = icing[0];
        c.fill();
        stroke(c, "rgba(74,35,48,0.35)", 2);
        // Sprinkles on the icing.
        for (let i = 0; i < 16; i++) {
          const a = rand() * Math.PI * 2;
          const d = r * (0.42 + rand() * 0.3);
          c.save();
          c.translate(Math.cos(a) * d, Math.sin(a) * d - 3);
          c.rotate(rand() * Math.PI);
          c.beginPath();
          c.roundRect(-6, -2, 12, 4, 2);
          c.fillStyle = SPRINKLE[Math.floor(rand() * SPRINKLE.length)];
          c.fill();
          c.restore();
        }
        // Glaze shine.
        c.beginPath();
        c.arc(0, -3, r * 0.62, Math.PI * 1.1, Math.PI * 1.45);
        stroke(c, icing[1], 5);
        // The hole shows the cloth beneath.
        c.beginPath();
        c.arc(0, -2, r * 0.26, 0, Math.PI * 2);
        c.fillStyle = "#d4e9ff";
        c.fill();
        stroke(c, "rgba(74,35,48,0.55)", 3);
        c.beginPath();
        c.arc(0, 0, r, 0, Math.PI * 2);
        stroke(c, INK, 4);
      }

      function paintDonuts(ctx) {
        ctx.fillStyle = "#d4e9ff";
        ctx.fillRect(0, 0, S, S);
        // A gingham cloth: 32 px checks.
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        for (let i = 0; i < 32; i += 2) ctx.fillRect(i * 32, 0, 32, S);
        ctx.fillStyle = "rgba(255,255,255,0.4)";
        for (let j = 0; j < 32; j += 2) ctx.fillRect(0, j * 32, S, 32);
        const rand = rng(321);
        let k = 0;
        for (let j = 0; j < 4; j++) {
          for (let i = 0; i < 4; i++) {
            const x = i * 256 + (j % 2) * 128 + 64 + (rand() - 0.5) * 30;
            const y = j * 256 + 128 + (rand() - 0.5) * 30;
            const icing = ICING[k++ % ICING.length];
            const seed = Math.floor(rand() * 1e9);
            const tilt = (rand() - 0.5) * 0.4;
            wrapped(ctx, x, y, 86, (c) => {
              c.rotate(tilt);
              donut(c, 72, icing, rng(seed));
            });
          }
        }
      }

      // -------------------------------------------------------------- gummies

      const GUMMY = [
        "#ff3b3b",
        "#ff9a1f",
        "#ffd51f",
        "#43c943",
        "#cfe3ff",
        "#ff5fa8",
      ];

      function gummy(c, col) {
        const shape = () => {
          c.beginPath();
          c.arc(0, -30, 17, 0, Math.PI * 2); // head
          c.moveTo(-13, -42);
          c.arc(-13, -42, 7, 0, Math.PI * 2); // ears
          c.moveTo(13, -42);
          c.arc(13, -42, 7, 0, Math.PI * 2);
          c.moveTo(20, 4);
          c.ellipse(0, 4, 20, 24, 0, 0, Math.PI * 2); // body
          c.moveTo(-14, -6);
          c.ellipse(-20, -6, 8, 7, 0.4, 0, Math.PI * 2); // arms
          c.moveTo(28, -6);
          c.ellipse(20, -6, 8, 7, -0.4, 0, Math.PI * 2);
          c.moveTo(-6, 26);
          c.ellipse(-12, 26, 9, 8, 0, 0, Math.PI * 2); // feet
          c.moveTo(21, 26);
          c.ellipse(12, 26, 9, 8, 0, 0, Math.PI * 2);
        };
        c.save();
        c.translate(3, 5);
        shape();
        c.fillStyle = "rgba(60,30,90,0.18)";
        c.fill();
        c.restore();
        shape();
        c.globalAlpha = 0.88;
        c.fillStyle = col;
        c.fill();
        c.globalAlpha = 1;
        stroke(c, "rgba(60,20,40,0.45)", 3);
        // A soft belly and glossy highlights.
        c.beginPath();
        c.ellipse(0, 8, 11, 13, 0, 0, Math.PI * 2);
        c.fillStyle = "rgba(255,255,255,0.22)";
        c.fill();
        c.beginPath();
        c.ellipse(-7, -37, 5, 3, -0.6, 0, Math.PI * 2);
        c.ellipse(-10, -6, 4, 7, 0.3, 0, Math.PI * 2);
        c.fillStyle = "rgba(255,255,255,0.8)";
        c.fill();
        // A face, pressed into the mould.
        c.fillStyle = "rgba(60,20,40,0.35)";
        c.beginPath();
        c.arc(-6, -32, 2.2, 0, Math.PI * 2);
        c.arc(6, -32, 2.2, 0, Math.PI * 2);
        c.fill();
        c.beginPath();
        c.arc(0, -26, 4, 0.2, Math.PI - 0.2);
        stroke(c, "rgba(60,20,40,0.35)", 1.8);
      }

      function paintGummies(ctx) {
        ctx.fillStyle = "#e8defc";
        ctx.fillRect(0, 0, S, S);
        // Tiny dots on the paper, 16 px grid.
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        for (let y = 0; y < S; y += 32) {
          for (let x = 0; x < S; x += 32) {
            ctx.beginPath();
            ctx.arc(x + ((y / 32) % 2) * 16, y, 2.4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        const rand = rng(331);
        for (const p of scatter(rand, 44, 132)) {
          const col = GUMMY[Math.floor(rand() * GUMMY.length)];
          const rot = (rand() - 0.5) * 1.6;
          wrapped(ctx, p.x, p.y, 76, (c) => {
            c.rotate(rot);
            c.scale(1.3, 1.3);
            gummy(c, col);
          });
        }
      }

      // ------------------------------------------------------------ ice cream

      const SCOOPS = [
        ["#ffb3c7", "#ff8fab"],
        ["#b9f2d0", "#86e0ae"],
        ["#8a5a44", "#6b4231"],
        ["#fff4d6", "#f2deb0"],
        ["#ffd27a", "#f7b84b"],
      ];

      function scoop(c, x, y, r, col, chips) {
        c.beginPath();
        c.arc(x, y, r, Math.PI, 0);
        // Drippy lower edge.
        const n = 5;
        for (let i = 0; i <= n; i++) {
          const px = x + r - (i / n) * 2 * r;
          const drip = i % 2 === 0 ? r * 0.18 : r * 0.38;
          c.quadraticCurveTo(
            px + r / n / 2,
            y + drip,
            px - (r / n) * 0.0,
            y + r * 0.12,
          );
        }
        c.closePath();
        c.fillStyle = col[0];
        c.fill();
        stroke(c, INK, 4);
        c.beginPath();
        c.arc(x - r * 0.35, y - r * 0.4, r * 0.22, 0, Math.PI * 2);
        c.fillStyle = "rgba(255,255,255,0.55)";
        c.fill();
        if (chips) {
          c.fillStyle = "#3b2418";
          for (const [dx, dy] of [
            [0.2, -0.5],
            [-0.3, -0.05],
            [0.45, -0.1],
            [0.0, -0.2],
          ]) {
            c.fillRect(x + dx * r - 3, y + dy * r - 2, 6, 4);
          }
        }
      }

      function cone(c, rand) {
        // The waffle cone, cross-hatched.
        c.beginPath();
        c.moveTo(-30, 0);
        c.lineTo(30, 0);
        c.lineTo(0, 78);
        c.closePath();
        c.fillStyle = "#e6a85b";
        c.fill();
        c.save();
        c.clip();
        c.strokeStyle = "#b9782f";
        c.lineWidth = 3;
        for (let i = -6; i < 8; i++) {
          c.beginPath();
          c.moveTo(-40 + i * 12, 0);
          c.lineTo(-40 + i * 12 + 60, 90);
          c.moveTo(40 - i * 12, 0);
          c.lineTo(40 - i * 12 - 60, 90);
          c.stroke();
        }
        c.restore();
        c.beginPath();
        c.moveTo(-30, 0);
        c.lineTo(30, 0);
        c.lineTo(0, 78);
        c.closePath();
        stroke(c, INK, 4);
        const a = SCOOPS[Math.floor(rand() * SCOOPS.length)];
        const two = rand() < 0.55;
        if (two) {
          const b = SCOOPS[Math.floor(rand() * SCOOPS.length)];
          scoop(c, 0, -34, 30, b, b === SCOOPS[1]);
        }
        scoop(c, 0, -4, 34, a, a === SCOOPS[1]);
        if (rand() < 0.5) {
          const top = two ? -62 : -36;
          c.beginPath();
          c.moveTo(0, top - 4);
          c.quadraticCurveTo(6, top - 16, 12, top - 20);
          stroke(c, "#3f7a2a", 3);
          c.beginPath();
          c.arc(0, top, 8, 0, Math.PI * 2);
          c.fillStyle = "#d61f3b";
          c.fill();
          stroke(c, INK, 3);
          c.beginPath();
          c.arc(-2.5, top - 2.5, 2.2, 0, Math.PI * 2);
          c.fillStyle = "rgba(255,255,255,0.8)";
          c.fill();
        }
      }

      function paintIceCream(ctx) {
        // A parlour awning: 32 px mint and cream stripes.
        for (let i = 0; i < 32; i++) {
          ctx.fillStyle = i % 2 ? "#fff3e3" : "#aee6d3";
          ctx.fillRect(i * 32, 0, 32, S);
        }
        const rand = rng(341);
        // Five to a row, four rows, every other row shifted half a place.
        for (let j = 0; j < 4; j++) {
          for (let i = 0; i < 5; i++) {
            const x = i * 204.8 + (j % 2) * 102.4 + (rand() - 0.5) * 24;
            const y = j * 256 + 120 + (rand() - 0.5) * 24;
            const seed = Math.floor(rand() * 1e9);
            const tilt = (rand() - 0.5) * 0.5;
            wrapped(ctx, x, y, 126, (c) => {
              c.rotate(tilt);
              c.scale(1.15, 1.15);
              cone(c, rng(seed));
            });
          }
        }
      }

      const SKINS = {
        sweets_peppermint: paintPeppermints,
        sweets_sprinkles: paintSprinkles,
        sweets_donuts: paintDonuts,
        sweets_gummies: paintGummies,
        sweets_icecream: paintIceCream,
      };

      window.renderSkins = () => renderAll(SKINS);
      window.renderSkins();
    </script>
  </body>
</html>
