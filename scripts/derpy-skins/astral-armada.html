<!doctype html>
<!--
  The Astral Armada skin pack for the Derp Store: five 1024×1024 territory
  skins, drawn here with the canvas 2D API so they can be redrawn and
  tweaked. Open this file in a browser and use the links under each skin to
  save it as resources/public/derpy-skins/<name>.png (or call
  window.renderSkins(), which returns { name: dataURL }).

  The committed PNGs were then cut to a 256-colour palette (Pillow's octree
  with Floyd–Steinberg dithering), which keeps them a third of the size and
  looks the same on the map:

    for f in resources/public/derpy-skins/armada_*.png; do python3 -c "
    import sys; from PIL import Image; im = Image.open(sys.argv[1]).convert('RGB')
    pal = im.quantize(256, method=Image.Quantize.FASTOCTREE)
    im.quantize(palette=pal, dither=Image.Dither.FLOYDSTEINBERG).save(sys.argv[1], optimize=True)
    " "$f"; done

  Skins are tiled across a whole territory, so every one wraps seamlessly:
  each shape that crosses an edge is drawn again on the opposite side, and
  the nebula noise is periodic.

  All original designs (manta-winged starfighters, spine-and-ring cruisers,
  an Armada emblem, three robots). Nothing here borrows from any film
  franchise's ships, droids, emblems or effects.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Astral Armada skins</title>
    <style>
      body {
        background: #111;
        color: #eee;
        font:
          14px system-ui,
          sans-serif;
        margin: 16px;
      }
      figure {
        display: inline-block;
        margin: 8px;
      }
      canvas {
        width: 256px;
        height: 256px;
        display: block;
      }
      a {
        color: #9cf;
      }
    </style>
  </head>
  <body>
    <div id="out"></div>
    <script>
      const S = 1024;
      const INK = "#141634";

      function rng(seed) {
        return () => {
          seed = (seed + 0x6d2b79f5) >>> 0;
          let t = seed;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      /** Draw at (x, y) and at every copy across an edge: seamless tiling. */
      function wrapped(ctx, x, y, r, fn) {
        for (const dx of [-S, 0, S]) {
          for (const dy of [-S, 0, S]) {
            const cx = x + dx;
            const cy = y + dy;
            if (cx + r < 0 || cx - r > S || cy + r < 0 || cy - r > S) continue;
            ctx.save();
            ctx.translate(cx, cy);
            fn(ctx);
            ctx.restore();
          }
        }
      }

      function outline(ctx, w = 4) {
        ctx.lineWidth = w;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.strokeStyle = INK;
        ctx.stroke();
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
      }

      function glow(ctx, x, y, r, color, alpha = 1) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, color);
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.globalAlpha = alpha;
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      function sparkle(ctx, r, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -r);
        ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.quadraticCurveTo(0, 0, 0, r);
        ctx.quadraticCurveTo(0, 0, -r, 0);
        ctx.quadraticCurveTo(0, 0, 0, -r);
        ctx.fill();
      }

      function starfield(
        ctx,
        rand,
        count,
        palette = ["#ffffff", "#cfe3ff", "#ffe9b8"],
      ) {
        for (let i = 0; i < count; i++) {
          const x = rand() * S;
          const y = rand() * S;
          const big = rand();
          const color = palette[Math.floor(rand() * palette.length)];
          if (big > 0.965) {
            const r = 6 + rand() * 7;
            wrapped(ctx, x, y, r * 2, (c) => {
              glow(c, 0, 0, r * 1.6, "rgba(190,220,255,0.35)");
              sparkle(c, r, color);
            });
          } else {
            const r = big > 0.8 ? 1.6 : 0.7 + rand() * 0.8;
            wrapped(ctx, x, y, r + 1, (c) => {
              c.globalAlpha = 0.45 + rand() * 0.55;
              c.fillStyle = color;
              c.beginPath();
              c.arc(0, 0, r, 0, Math.PI * 2);
              c.fill();
              c.globalAlpha = 1;
            });
          }
        }
      }

      // Periodic value noise on the 1024 torus: a lattice of random values
      // that wraps, smoothly interpolated, several octaves.
      function tileNoise(rand, octaves) {
        const layers = octaves.map((cells) => {
          const v = new Float32Array(cells * cells);
          for (let i = 0; i < v.length; i++) v[i] = rand();
          return { cells, v };
        });
        const smooth = (t) => t * t * t * (t * (t * 6 - 15) + 10);
        return (x, y) => {
          let sum = 0;
          let amp = 1;
          let norm = 0;
          for (const { cells, v } of layers) {
            const gx = (x / S) * cells;
            const gy = (y / S) * cells;
            const ix = Math.floor(gx);
            const iy = Math.floor(gy);
            const fx = smooth(gx - ix);
            const fy = smooth(gy - iy);
            const x0 = ((ix % cells) + cells) % cells;
            const y0 = ((iy % cells) + cells) % cells;
            const x1 = (x0 + 1) % cells;
            const y1 = (y0 + 1) % cells;
            const a = v[y0 * cells + x0];
            const b = v[y0 * cells + x1];
            const c = v[y1 * cells + x0];
            const d = v[y1 * cells + x1];
            const top = a + (b - a) * fx;
            const bot = c + (d - c) * fx;
            sum += (top + (bot - top) * fy) * amp;
            norm += amp;
            amp *= 0.55;
          }
          return sum / norm;
        };
      }

      function hex(c) {
        return [
          parseInt(c.slice(1, 3), 16),
          parseInt(c.slice(3, 5), 16),
          parseInt(c.slice(5, 7), 16),
        ];
      }

      function lerp3(a, b, t) {
        return [
          a[0] + (b[0] - a[0]) * t,
          a[1] + (b[1] - a[1]) * t,
          a[2] + (b[2] - a[2]) * t,
        ];
      }

      /**
       * A nebula wash over the whole image: a base colour, soft coloured
       * clouds, and (with `filaments`) brighter ridged wisps inside them.
       */
      function nebulaWash(
        ctx,
        seed,
        base,
        clouds,
        strength,
        octaves = [3, 6, 12, 24, 48],
        filaments = 0,
      ) {
        const rand = rng(seed);
        const density = tileNoise(rand, octaves);
        const hue = tileNoise(rand, [2, 4, 8]);
        const ridge = tileNoise(rand, [4, 8, 16, 32, 64]);
        const img = ctx.createImageData(S, S);
        const b = hex(base);
        const cs = clouds.map(hex);
        for (let y = 0; y < S; y++) {
          for (let x = 0; x < S; x++) {
            const raw = density(x, y);
            const d = Math.max(0, raw - 0.36) / 0.64;
            const h = Math.min(0.999, Math.max(0, (hue(x, y) - 0.25) * 1.9));
            const k = h * (cs.length - 1);
            const i = Math.floor(k);
            const col = lerp3(cs[i], cs[Math.min(cs.length - 1, i + 1)], k - i);
            let t = Math.min(1, Math.pow(d, 1.4) * strength);
            let out = lerp3(b, col, t);
            if (filaments > 0) {
              const r = 1 - Math.abs(2 * ridge(x, y) - 1);
              const f = Math.pow(r, 9) * Math.min(1, d * 1.6) * filaments;
              out = lerp3(
                out,
                lerp3(col, [255, 230, 245], 0.6),
                Math.min(0.5, f),
              );
            }
            const p = (y * S + x) * 4;
            img.data[p] = out[0];
            img.data[p + 1] = out[1];
            img.data[p + 2] = out[2];
            img.data[p + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
      }

      // ------------------------------------------------------------ ships

      const FIGHTER_SCHEMES = [
        {
          hull: "#eef2fa",
          shade: "#b9c3da",
          wing: "#ff8a3d",
          wingShade: "#d9622a",
          stripe: "#ffd25a",
          glass: "#56e3ff",
          glow: "rgba(90,230,255,0.95)",
          bolt: "#ff3fb4",
        },
        {
          hull: "#eef2fa",
          shade: "#b9c3da",
          wing: "#2bc6b3",
          wingShade: "#1c9488",
          stripe: "#f6f1df",
          glass: "#ffd45a",
          glow: "rgba(255,190,90,0.95)",
          bolt: "#ffd23f",
        },
      ];

      // A manta-winged starfighter, nose along +x.
      function fighter(ctx, s) {
        for (const ey of [-9, 0, 9]) {
          glow(ctx, -56, ey, 30, s.glow, 0.85);
        }
        // Engine plume streaks.
        for (const ey of [-9, 0, 9]) {
          const g = ctx.createLinearGradient(-48, 0, -110, 0);
          g.addColorStop(0, s.glow);
          g.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(-46, ey - 3.5);
          ctx.lineTo(-108, ey);
          ctx.lineTo(-46, ey + 3.5);
          ctx.fill();
        }
        // Wings: one curved delta, tips curling forward.
        ctx.beginPath();
        ctx.moveTo(14, -7);
        ctx.bezierCurveTo(-2, -18, -16, -36, -24, -50);
        ctx.quadraticCurveTo(-28, -58, -36, -52);
        ctx.lineTo(-42, -17);
        ctx.lineTo(-42, 17);
        ctx.lineTo(-36, 52);
        ctx.quadraticCurveTo(-28, 58, -24, 50);
        ctx.bezierCurveTo(-16, 36, -2, 18, 14, 7);
        ctx.closePath();
        ctx.fillStyle = s.wing;
        ctx.fill();
        // Shade the trailing half.
        ctx.save();
        ctx.clip();
        ctx.fillStyle = s.wingShade;
        ctx.fillRect(-60, -70, 26, 140);
        // Chevron stripes near the tips.
        ctx.strokeStyle = s.stripe;
        ctx.lineWidth = 4;
        for (const sign of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(-12, sign * 24);
          ctx.lineTo(-22, sign * 36);
          ctx.lineTo(-34, sign * 34);
          ctx.stroke();
        }
        ctx.restore();
        ctx.beginPath();
        ctx.moveTo(14, -7);
        ctx.bezierCurveTo(-2, -18, -16, -36, -24, -50);
        ctx.quadraticCurveTo(-28, -58, -36, -52);
        ctx.lineTo(-42, -17);
        ctx.lineTo(-42, 17);
        ctx.lineTo(-36, 52);
        ctx.quadraticCurveTo(-28, 58, -24, 50);
        ctx.bezierCurveTo(-16, 36, -2, 18, 14, 7);
        ctx.closePath();
        outline(ctx, 3.5);
        // Wingtip lights.
        for (const sign of [-1, 1]) {
          glow(ctx, -31, sign * 53, 7, "rgba(255,255,255,0.9)");
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(-31, sign * 53, 2, 0, Math.PI * 2);
          ctx.fill();
        }
        // Hull.
        ctx.beginPath();
        ctx.moveTo(58, 0);
        ctx.quadraticCurveTo(34, -12, -18, -11);
        ctx.lineTo(-48, -10);
        ctx.lineTo(-48, 10);
        ctx.lineTo(-18, 11);
        ctx.quadraticCurveTo(34, 12, 58, 0);
        ctx.closePath();
        ctx.fillStyle = s.hull;
        ctx.fill();
        ctx.save();
        ctx.clip();
        ctx.fillStyle = s.shade;
        ctx.fillRect(-60, 2, 130, 20);
        ctx.fillStyle = s.wing;
        ctx.fillRect(-48, -11, 9, 22);
        ctx.restore();
        ctx.beginPath();
        ctx.moveTo(58, 0);
        ctx.quadraticCurveTo(34, -12, -18, -11);
        ctx.lineTo(-48, -10);
        ctx.lineTo(-48, 10);
        ctx.lineTo(-18, 11);
        ctx.quadraticCurveTo(34, 12, 58, 0);
        ctx.closePath();
        outline(ctx, 3.5);
        // Canopy.
        ctx.beginPath();
        ctx.ellipse(18, -1, 13, 5.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = s.glass;
        ctx.fill();
        outline(ctx, 3);
        ctx.fillStyle = "rgba(255,255,255,0.85)";
        ctx.beginPath();
        ctx.ellipse(22, -3, 5, 1.6, -0.15, 0, Math.PI * 2);
        ctx.fill();
        // Nozzles.
        for (const ey of [-6, 6]) {
          roundRect(ctx, -54, ey - 3.5, 8, 7, 2);
          ctx.fillStyle = "#5d6787";
          ctx.fill();
          outline(ctx, 2.5);
        }
      }

      function laser(ctx, x0, x1, y, color) {
        ctx.lineCap = "round";
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.35;
        ctx.lineWidth = 11;
        ctx.beginPath();
        ctx.moveTo(x0, y);
        ctx.lineTo(x1, y);
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(x0, y);
        ctx.lineTo(x1, y);
        ctx.stroke();
        ctx.strokeStyle = "#fff8fd";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x0 + 3, y);
        ctx.lineTo(x1 - 3, y);
        ctx.stroke();
      }

      function paintFighters(ctx) {
        nebulaWash(ctx, 11, "#0a0d2a", ["#1d2a6b", "#3b2470", "#173f63"], 0.55);
        starfield(ctx, rng(12), 420);
        const angle = -0.62;
        for (let j = 0; j < 4; j++) {
          for (let i = 0; i < 4; i++) {
            const x = i * 256 + (j % 2) * 128 + 70;
            const y = j * 256 + 110;
            const s = FIGHTER_SCHEMES[(i + j) % 2];
            wrapped(ctx, x, y, 210, (c) => {
              c.rotate(angle);
              laser(c, 74, 118, -16, s.bolt);
              laser(c, 84, 128, 16, s.bolt);
              fighter(c, s);
            });
          }
        }
      }

      // A long cruiser: engine bank, radiator fins, a spine with pods, a
      // spinning habitat ring, a forward command block. Nose along +x.
      function cruiser(ctx, L, accent) {
        const h = L * 0.05;
        const back = -L / 2;
        const front = L / 2;
        // Engine plumes.
        for (const ey of [-h * 1.1, h * 1.1]) {
          const g = ctx.createLinearGradient(back, 0, back - L * 0.42, 0);
          g.addColorStop(0, "rgba(140,220,255,0.95)");
          g.addColorStop(0.35, "rgba(90,150,255,0.45)");
          g.addColorStop(1, "rgba(60,80,255,0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(back + 2, ey - h * 0.8);
          ctx.lineTo(back - L * 0.42, ey);
          ctx.lineTo(back + 2, ey + h * 0.8);
          ctx.fill();
          glow(ctx, back - 4, ey, h * 2.2, "rgba(160,230,255,0.9)");
        }
        // Radiator fins.
        for (const sign of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(back + L * 0.2, sign * h * 0.8);
          ctx.lineTo(back + L * 0.24, sign * h * 3.3);
          ctx.lineTo(back + L * 0.44, sign * h * 3.3);
          ctx.lineTo(back + L * 0.46, sign * h * 0.8);
          ctx.closePath();
          ctx.fillStyle = "#f0e2c8";
          ctx.fill();
          ctx.save();
          ctx.clip();
          ctx.strokeStyle = accent;
          ctx.lineWidth = 3;
          for (let k = 0; k < 7; k++) {
            const x = back + L * 0.215 + k * L * 0.035;
            ctx.beginPath();
            ctx.moveTo(x, sign * h);
            ctx.lineTo(x + L * 0.01, sign * h * 3.4);
            ctx.stroke();
          }
          ctx.restore();
          ctx.beginPath();
          ctx.moveTo(back + L * 0.2, sign * h * 0.8);
          ctx.lineTo(back + L * 0.24, sign * h * 3.3);
          ctx.lineTo(back + L * 0.44, sign * h * 3.3);
          ctx.lineTo(back + L * 0.46, sign * h * 0.8);
          ctx.closePath();
          outline(ctx, 3);
        }
        // Back half of the ring, behind the spine.
        const rx = front - L * 0.36;
        ctx.lineWidth = h * 0.9;
        ctx.strokeStyle = "#7f8bab";
        ctx.beginPath();
        ctx.ellipse(rx, 0, h * 1.1, h * 4.2, 0, Math.PI * 0.5, Math.PI * 1.5);
        ctx.stroke();
        // Spine.
        roundRect(ctx, back + 6, -h, L * 0.8, h * 2, h * 0.4);
        ctx.fillStyle = "#cdd5e6";
        ctx.fill();
        ctx.save();
        ctx.clip();
        ctx.fillStyle = "#9aa6c2";
        ctx.fillRect(back, h * 0.15, L, h);
        ctx.restore();
        roundRect(ctx, back + 6, -h, L * 0.8, h * 2, h * 0.4);
        outline(ctx, 3);
        // Cargo pods along the spine.
        for (let k = 0; k < 4; k++) {
          const x = back + L * 0.5 + k * L * 0.065;
          for (const sign of [-1, 1]) {
            roundRect(
              ctx,
              x,
              sign > 0 ? h * 0.7 : -h * 1.9,
              L * 0.05,
              h * 1.2,
              3,
            );
            ctx.fillStyle = k % 2 ? "#b4bed6" : accent;
            ctx.fill();
            outline(ctx, 2.5);
          }
        }
        // Engine block.
        roundRect(ctx, back, -h * 1.9, L * 0.14, h * 3.8, h * 0.6);
        ctx.fillStyle = "#aeb8d0";
        ctx.fill();
        ctx.save();
        ctx.clip();
        ctx.fillStyle = "#7f8bab";
        ctx.fillRect(back, h * 0.3, L * 0.14, h * 2);
        ctx.restore();
        roundRect(ctx, back, -h * 1.9, L * 0.14, h * 3.8, h * 0.6);
        outline(ctx, 3);
        for (const ey of [-h * 1.1, h * 1.1]) {
          roundRect(ctx, back - 7, ey - h * 0.6, 9, h * 1.2, 3);
          ctx.fillStyle = "#4d577a";
          ctx.fill();
          outline(ctx, 2.5);
        }
        // Front half of the ring.
        ctx.lineWidth = h * 0.9 + 6;
        ctx.strokeStyle = INK;
        ctx.beginPath();
        ctx.ellipse(rx, 0, h * 1.1, h * 4.2, 0, -Math.PI * 0.5, Math.PI * 0.5);
        ctx.stroke();
        ctx.lineWidth = h * 0.9;
        ctx.strokeStyle = "#dfe5f2";
        ctx.beginPath();
        ctx.ellipse(rx, 0, h * 1.1, h * 4.2, 0, -Math.PI * 0.5, Math.PI * 0.5);
        ctx.stroke();
        ctx.fillStyle = "#ffe08a";
        for (let k = -3; k <= 3; k++) {
          const t = (k / 4) * Math.PI * 0.5;
          ctx.beginPath();
          ctx.arc(
            rx + Math.cos(t) * h * 1.1,
            Math.sin(t) * h * 4.2,
            2,
            0,
            Math.PI * 2,
          );
          ctx.fill();
        }
        // Command block and prow.
        const cb = front - L * 0.2;
        ctx.beginPath();
        ctx.moveTo(cb, -h * 1.8);
        ctx.lineTo(front - L * 0.06, -h * 1.5);
        ctx.lineTo(front, 0);
        ctx.lineTo(front - L * 0.06, h * 1.5);
        ctx.lineTo(cb, h * 1.8);
        ctx.closePath();
        ctx.fillStyle = "#dfe5f2";
        ctx.fill();
        ctx.save();
        ctx.clip();
        ctx.fillStyle = "#a9b4cd";
        ctx.fillRect(cb, h * 0.2, L * 0.25, h * 2);
        ctx.fillStyle = accent;
        ctx.fillRect(cb + L * 0.03, -h * 1.8, L * 0.025, h * 3.6);
        ctx.restore();
        ctx.beginPath();
        ctx.moveTo(cb, -h * 1.8);
        ctx.lineTo(front - L * 0.06, -h * 1.5);
        ctx.lineTo(front, 0);
        ctx.lineTo(front - L * 0.06, h * 1.5);
        ctx.lineTo(cb, h * 1.8);
        ctx.closePath();
        outline(ctx, 3);
        // Bridge windows.
        ctx.fillStyle = "#7fe9ff";
        for (let k = 0; k < 4; k++) {
          ctx.fillRect(
            cb + L * 0.075 + k * L * 0.022,
            -h * 0.9,
            L * 0.012,
            h * 0.5,
          );
        }
        // Running lights along the spine.
        ctx.fillStyle = "#ffe08a";
        for (let k = 0; k < 9; k++) {
          ctx.beginPath();
          ctx.arc(
            back + L * 0.16 + k * L * 0.035,
            -h * 0.35,
            1.6,
            0,
            Math.PI * 2,
          );
          ctx.fill();
        }
      }

      function ringedPlanet(ctx, r, body, band, ring, tilt = -0.32) {
        const ringBack = () => {
          ctx.beginPath();
          ctx.ellipse(0, 0, r * 1.75, r * 0.42, tilt, Math.PI, Math.PI * 2);
        };
        const ringFront = () => {
          ctx.beginPath();
          ctx.ellipse(0, 0, r * 1.75, r * 0.42, tilt, 0, Math.PI);
        };
        ctx.lineWidth = r * 0.13 + 7;
        ctx.strokeStyle = INK;
        ringBack();
        ctx.stroke();
        ctx.lineWidth = r * 0.13;
        ctx.strokeStyle = ring;
        ringBack();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = body;
        ctx.fill();
        ctx.save();
        ctx.clip();
        ctx.rotate(tilt);
        ctx.fillStyle = band;
        for (let k = -3; k <= 3; k++) {
          ctx.globalAlpha = 0.55;
          ctx.fillRect(-r * 1.2, k * r * 0.3 - r * 0.07, r * 2.4, r * 0.12);
        }
        ctx.globalAlpha = 0.28;
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(r * 0.35, r * 0.25, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.restore();
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        outline(ctx, 4);
        ctx.lineWidth = r * 0.13 + 7;
        ctx.strokeStyle = INK;
        ringFront();
        ctx.stroke();
        ctx.lineWidth = r * 0.13;
        ctx.strokeStyle = ring;
        ringFront();
        ctx.stroke();
      }

      function paintCruisers(ctx) {
        nebulaWash(ctx, 21, "#080a20", ["#2a1a5c", "#16305e", "#3a1648"], 0.7);
        starfield(ctx, rng(22), 360);
        wrapped(ctx, 820, 790, 290, (c) =>
          ringedPlanet(c, 130, "#e3a35a", "#b5652e", "#f4dfb0"),
        );
        wrapped(ctx, 118, 560, 60, (c) => {
          c.beginPath();
          c.arc(0, 0, 34, 0, Math.PI * 2);
          c.fillStyle = "#9fb3d9";
          c.fill();
          c.save();
          c.clip();
          c.globalAlpha = 0.3;
          c.fillStyle = "#000";
          c.beginPath();
          c.arc(12, 9, 34, 0, Math.PI * 2);
          c.fill();
          c.restore();
          c.beginPath();
          c.arc(0, 0, 34, 0, Math.PI * 2);
          outline(c, 4);
        });
        const ships = [
          [300, 270, 360, "#ff7a3d"],
          [720, 390, 280, "#2bc6b3"],
          [380, 700, 300, "#ffc93c"],
          [880, 90, 220, "#e05aa8"],
        ];
        for (const [x, y, L, accent] of ships) {
          wrapped(ctx, x, y, L * 0.75, (c) => {
            c.rotate(-0.34);
            cruiser(c, L, accent);
          });
        }
      }

      // ------------------------------------------------------- nebula
      function paintNebula(ctx) {
        nebulaWash(
          ctx,
          31,
          "#06071a",
          ["#4a22a8", "#d23c94", "#ff8a5c", "#1fc2d1", "#7a32d6"],
          1.6,
          [3, 6, 12, 24, 48, 96],
          0.55,
        );
        // Bright knots inside the clouds.
        const r = rng(32);
        for (let i = 0; i < 9; i++) {
          wrapped(ctx, r() * S, r() * S, 120, (c) =>
            glow(c, 0, 0, 60 + r() * 60, "rgba(255,210,240,0.22)"),
          );
        }
        starfield(ctx, rng(33), 520, ["#ffffff", "#ffe2f4", "#d4f3ff"]);
        wrapped(ctx, 250, 760, 140, (c) =>
          ringedPlanet(c, 54, "#4fd1c5", "#2a8f9a", "#ffe0a6", 0.35),
        );
        wrapped(ctx, 760, 260, 110, (c) =>
          ringedPlanet(c, 38, "#ffb35c", "#d06a2c", "#f4f0ff", -0.5),
        );
        wrapped(ctx, 610, 900, 60, (c) => {
          c.beginPath();
          c.arc(0, 0, 20, 0, Math.PI * 2);
          c.fillStyle = "#c9a6ff";
          c.fill();
          c.save();
          c.clip();
          c.globalAlpha = 0.3;
          c.fillStyle = "#000";
          c.beginPath();
          c.arc(7, 6, 20, 0, Math.PI * 2);
          c.fill();
          c.globalAlpha = 0.5;
          c.fillStyle = "#a07ee6";
          for (const [cx, cy, cr] of [
            [-6, -5, 4],
            [5, 3, 3],
            [-2, 9, 2.5],
          ]) {
            c.beginPath();
            c.arc(cx, cy, cr, 0, Math.PI * 2);
            c.fill();
          }
          c.restore();
          c.beginPath();
          c.arc(0, 0, 20, 0, Math.PI * 2);
          outline(c, 3.5);
        });
        // Comets.
        for (const [x, y, a] of [
          [120, 180, 0.6],
          [880, 620, 2.4],
        ]) {
          wrapped(ctx, x, y, 170, (c) => {
            c.rotate(a);
            const g = c.createLinearGradient(0, 0, -150, 0);
            g.addColorStop(0, "rgba(220,250,255,0.9)");
            g.addColorStop(1, "rgba(120,200,255,0)");
            c.fillStyle = g;
            c.beginPath();
            c.moveTo(0, -7);
            c.quadraticCurveTo(-90, -14, -150, 0);
            c.quadraticCurveTo(-90, 14, 0, 7);
            c.fill();
            glow(c, 0, 0, 16, "rgba(220,250,255,0.9)");
            c.fillStyle = "#fff";
            c.beginPath();
            c.arc(0, 0, 5, 0, Math.PI * 2);
            c.fill();
          });
        }
      }

      // ------------------------------------------------------ insignia
      // The Astral Armada's own emblem: a ringed world under a great
      // four-pointed guiding star, an arc of five stars over it, in a
      // gold-rimmed roundel with a ribbon below.
      function emblem(ctx) {
        // Ribbon tails behind the roundel.
        for (const sign of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(sign * 34, 44);
          ctx.lineTo(sign * 78, 52);
          ctx.lineTo(sign * 66, 62);
          ctx.lineTo(sign * 76, 74);
          ctx.lineTo(sign * 30, 66);
          ctx.closePath();
          ctx.fillStyle = "#b8323f";
          ctx.fill();
          outline(ctx, 3.5);
        }
        ctx.beginPath();
        ctx.arc(0, 0, 66, 0, Math.PI * 2);
        ctx.fillStyle = "#e7b84a";
        ctx.fill();
        outline(ctx, 4);
        ctx.beginPath();
        ctx.arc(0, 0, 56, 0, Math.PI * 2);
        ctx.fillStyle = "#13235e";
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#b8872a";
        ctx.stroke();
        ctx.fillStyle = "#fff2c4";
        for (let k = 0; k < 20; k++) {
          const t = (k / 20) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(Math.cos(t) * 61, Math.sin(t) * 61, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
        // Arc of five small stars.
        for (let k = 0; k < 5; k++) {
          const t = Math.PI * (1.15 + k * 0.175);
          ctx.save();
          ctx.translate(Math.cos(t) * 44, Math.sin(t) * 44);
          sparkle(ctx, 4.5, "#fff2c4");
          ctx.restore();
        }
        // The guiding star, rising behind the world.
        ctx.save();
        ctx.translate(16, -12);
        glow(ctx, 0, 0, 26, "rgba(255,224,138,0.55)");
        ctx.beginPath();
        ctx.moveTo(0, -30);
        ctx.quadraticCurveTo(3, -3, 30, 0);
        ctx.quadraticCurveTo(3, 3, 0, 30);
        ctx.quadraticCurveTo(-3, 3, -30, 0);
        ctx.quadraticCurveTo(-3, -3, 0, -30);
        ctx.fillStyle = "#ffe08a";
        ctx.fill();
        outline(ctx, 3);
        ctx.restore();
        // The world and its ring.
        ctx.save();
        ctx.translate(-9, 9);
        ringedPlanet(ctx, 21, "#2bc6b3", "#1c9488", "#e7b84a", -0.42);
        ctx.restore();
        // Ribbon front.
        ctx.beginPath();
        ctx.moveTo(-44, 48);
        ctx.quadraticCurveTo(0, 60, 44, 48);
        ctx.lineTo(42, 64);
        ctx.quadraticCurveTo(0, 76, -42, 64);
        ctx.closePath();
        ctx.fillStyle = "#e0424f";
        ctx.fill();
        outline(ctx, 3.5);
        ctx.fillStyle = "#fff2c4";
        for (const x of [-20, 0, 20]) {
          ctx.save();
          ctx.translate(x, 61 + Math.abs(x) * -0.12);
          sparkle(ctx, 3.5, "#fff2c4");
          ctx.restore();
        }
      }

      // Three gold rank chevrons, between the roundels.
      function rank(ctx) {
        for (let k = 0; k < 3; k++) {
          ctx.beginPath();
          ctx.moveTo(-16, -6 + k * 9);
          ctx.lineTo(0, -16 + k * 9);
          ctx.lineTo(16, -6 + k * 9);
          ctx.lineWidth = 8;
          ctx.strokeStyle = INK;
          ctx.stroke();
          ctx.lineWidth = 4.5;
          ctx.strokeStyle = "#e7b84a";
          ctx.stroke();
        }
      }

      function paintInsignia(ctx) {
        ctx.fillStyle = "#0e1a4a";
        ctx.fillRect(0, 0, S, S);
        // A faint gold diamond lattice (period 128, so it tiles).
        ctx.strokeStyle = "rgba(231,184,74,0.13)";
        ctx.lineWidth = 2;
        for (let k = -S; k <= 2 * S; k += 128) {
          ctx.beginPath();
          ctx.moveTo(k, 0);
          ctx.lineTo(k + S, S);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(k, 0);
          ctx.lineTo(k - S, S);
          ctx.stroke();
        }
        starfield(ctx, rng(42), 160, ["#ffe9b8", "#ffffff"]);
        for (let j = 0; j < 4; j++) {
          for (let i = 0; i < 4; i++) {
            const x = i * 256 + (j % 2) * 128 + 64;
            const y = j * 256 + 64;
            wrapped(ctx, x, y, 90, (c) => emblem(c));
            wrapped(ctx, x + 128, y + 128, 24, (c) => rank(c));
          }
        }
      }

      // ------------------------------------------------------- robots
      function eye(ctx, x, y, r, iris) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = iris;
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(x - r * 0.3, y - r * 0.35, r * 0.35, 0, Math.PI * 2);
        ctx.fill();
      }

      // Sprocket: a tin box on legs with a screen face and noodle arms.
      function botBox(ctx) {
        // Arms.
        for (const sign of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(sign * 28, 10);
          ctx.bezierCurveTo(sign * 52, 10, sign * 40, 40, sign * 56, 44);
          ctx.lineWidth = 11;
          ctx.strokeStyle = INK;
          ctx.stroke();
          ctx.lineWidth = 6;
          ctx.strokeStyle = "#c7cfdf";
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(sign * 57, 46, 7, 0, Math.PI * 2);
          ctx.fillStyle = "#ff6b6b";
          ctx.fill();
          outline(ctx, 3);
        }
        // Legs and feet.
        for (const sign of [-1, 1]) {
          roundRect(ctx, sign * 13 - 5, 34, 10, 22, 4);
          ctx.fillStyle = "#9aa6c2";
          ctx.fill();
          outline(ctx, 3);
          roundRect(ctx, sign * 13 - 11, 52, 22, 10, 5);
          ctx.fillStyle = "#4d577a";
          ctx.fill();
          outline(ctx, 3);
        }
        // Body.
        roundRect(ctx, -30, -6, 60, 44, 10);
        ctx.fillStyle = "#ff9f43";
        ctx.fill();
        ctx.save();
        ctx.clip();
        ctx.fillStyle = "#e67e22";
        ctx.fillRect(-30, 22, 60, 20);
        ctx.restore();
        roundRect(ctx, -30, -6, 60, 44, 10);
        outline(ctx);
        for (const [x, col] of [
          [-12, "#ff6b6b"],
          [0, "#ffe066"],
          [12, "#4dd4ff"],
        ]) {
          ctx.beginPath();
          ctx.arc(x, 12, 4.5, 0, Math.PI * 2);
          ctx.fillStyle = col;
          ctx.fill();
          outline(ctx, 2.5);
        }
        // Antenna.
        ctx.beginPath();
        ctx.moveTo(0, -46);
        ctx.lineTo(0, -60);
        ctx.lineWidth = 4;
        ctx.strokeStyle = INK;
        ctx.stroke();
        glow(ctx, 0, -63, 12, "rgba(255,90,90,0.8)");
        ctx.beginPath();
        ctx.arc(0, -63, 5, 0, Math.PI * 2);
        ctx.fillStyle = "#ff5a5a";
        ctx.fill();
        outline(ctx, 2.5);
        // Head with a screen face.
        roundRect(ctx, -28, -48, 56, 40, 12);
        ctx.fillStyle = "#e8ecf4";
        ctx.fill();
        outline(ctx);
        roundRect(ctx, -21, -42, 42, 28, 8);
        ctx.fillStyle = "#1b2a4a";
        ctx.fill();
        roundRect(ctx, -13, -36, 8, 11, 3);
        ctx.fillStyle = "#5ff2ff";
        ctx.fill();
        roundRect(ctx, 5, -36, 8, 11, 3);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, -24, 7, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = "#5ff2ff";
        ctx.stroke();
      }

      // Bubbles: a round-bodied hover bot with porthole eyes and a jet.
      function botHover(ctx) {
        glow(ctx, 0, 52, 26, "rgba(120,230,255,0.85)");
        ctx.beginPath();
        ctx.moveTo(-10, 30);
        ctx.lineTo(0, 66);
        ctx.lineTo(10, 30);
        ctx.fillStyle = "rgba(170,240,255,0.9)";
        ctx.fill();
        // Side fins.
        for (const sign of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(sign * 34, -4);
          ctx.lineTo(sign * 54, 10);
          ctx.lineTo(sign * 34, 18);
          ctx.closePath();
          ctx.fillStyle = "#ffcf5a";
          ctx.fill();
          outline(ctx, 3);
        }
        // Body: a squat rounded bean.
        ctx.beginPath();
        ctx.ellipse(0, 0, 38, 32, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#2bc6b3";
        ctx.fill();
        ctx.save();
        ctx.clip();
        ctx.fillStyle = "#1c9488";
        ctx.fillRect(-40, 12, 80, 30);
        ctx.restore();
        ctx.beginPath();
        ctx.ellipse(0, 0, 38, 32, 0, 0, Math.PI * 2);
        outline(ctx);
        // Face plate.
        roundRect(ctx, -26, -18, 52, 26, 13);
        ctx.fillStyle = "#e9f7f5";
        ctx.fill();
        outline(ctx, 3);
        eye(ctx, -11, -5, 7, "#2b3a67");
        eye(ctx, 11, -5, 7, "#2b3a67");
        // Rivets and a top bolt.
        ctx.fillStyle = "#e9f7f5";
        for (const x of [-22, 22]) {
          ctx.beginPath();
          ctx.arc(x, 18, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
        roundRect(ctx, -6, -40, 12, 9, 3);
        ctx.fillStyle = "#ffcf5a";
        ctx.fill();
        outline(ctx, 3);
      }

      // Pip: a lanky lilac bot with one big lens and spring legs.
      function botLens(ctx) {
        // Spring legs.
        for (const sign of [-1, 1]) {
          ctx.beginPath();
          for (let k = 0; k <= 6; k++) {
            const y = 26 + k * 5;
            const x = sign * 11 + (k % 2 ? 5 : -5);
            if (k === 0) ctx.moveTo(sign * 11, y);
            else ctx.lineTo(x, y);
          }
          ctx.lineWidth = 7;
          ctx.strokeStyle = INK;
          ctx.stroke();
          ctx.lineWidth = 3.5;
          ctx.strokeStyle = "#d9def0";
          ctx.stroke();
          ctx.beginPath();
          ctx.ellipse(sign * 11, 60, 11, 5, 0, 0, Math.PI * 2);
          ctx.fillStyle = "#6c5ce7";
          ctx.fill();
          outline(ctx, 3);
        }
        // Arms with pincers.
        for (const sign of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(sign * 20, -2);
          ctx.lineTo(sign * 42, -18);
          ctx.lineWidth = 9;
          ctx.strokeStyle = INK;
          ctx.stroke();
          ctx.lineWidth = 4.5;
          ctx.strokeStyle = "#d9def0";
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(
            sign * 45,
            -21,
            7,
            sign > 0 ? -1.9 : 0.4,
            sign > 0 ? 1.2 : 3.6,
          );
          ctx.lineWidth = 7;
          ctx.strokeStyle = INK;
          ctx.stroke();
          ctx.lineWidth = 3.5;
          ctx.strokeStyle = "#ffcf5a";
          ctx.stroke();
        }
        // Body: a trapezoid.
        ctx.beginPath();
        ctx.moveTo(-17, -12);
        ctx.lineTo(17, -12);
        ctx.lineTo(23, 28);
        ctx.lineTo(-23, 28);
        ctx.closePath();
        ctx.fillStyle = "#a78bfa";
        ctx.fill();
        ctx.save();
        ctx.clip();
        ctx.fillStyle = "#8b6cf0";
        ctx.fillRect(-30, 12, 60, 20);
        ctx.restore();
        ctx.beginPath();
        ctx.moveTo(-17, -12);
        ctx.lineTo(17, -12);
        ctx.lineTo(23, 28);
        ctx.lineTo(-23, 28);
        ctx.closePath();
        outline(ctx);
        roundRect(ctx, -9, 0, 18, 14, 3);
        ctx.fillStyle = "#ffe066";
        ctx.fill();
        outline(ctx, 2.5);
        // Neck and head.
        roundRect(ctx, -5, -22, 10, 12, 2);
        ctx.fillStyle = "#9aa6c2";
        ctx.fill();
        outline(ctx, 2.5);
        ctx.beginPath();
        ctx.arc(0, -40, 22, 0, Math.PI * 2);
        ctx.fillStyle = "#e8ecf4";
        ctx.fill();
        outline(ctx);
        ctx.beginPath();
        ctx.arc(0, -40, 14, 0, Math.PI * 2);
        ctx.fillStyle = "#2b3a67";
        ctx.fill();
        outline(ctx, 3);
        ctx.beginPath();
        ctx.arc(0, -40, 8, 0, Math.PI * 2);
        ctx.fillStyle = "#ff9f43";
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(-4, -44, 3.2, 0, Math.PI * 2);
        ctx.fill();
        // Little ear lights.
        for (const sign of [-1, 1]) {
          ctx.beginPath();
          ctx.arc(sign * 22, -40, 4, 0, Math.PI * 2);
          ctx.fillStyle = "#ff6b6b";
          ctx.fill();
          outline(ctx, 2.5);
        }
      }

      function gear(ctx, r, color) {
        ctx.beginPath();
        const teeth = 8;
        for (let k = 0; k < teeth * 2; k++) {
          const t = (k / (teeth * 2)) * Math.PI * 2;
          const rr = k % 2 ? r : r * 1.28;
          ctx.lineTo(Math.cos(t - 0.15) * rr, Math.sin(t - 0.15) * rr);
          ctx.lineTo(Math.cos(t + 0.15) * rr, Math.sin(t + 0.15) * rr);
        }
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        outline(ctx, 2.5);
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.38, 0, Math.PI * 2);
        ctx.fillStyle = "#2a1f5e";
        ctx.fill();
        outline(ctx, 2);
      }

      function paintRobots(ctx) {
        ctx.fillStyle = "#2a1f5e";
        ctx.fillRect(0, 0, S, S);
        // Faint circuit traces on a 64 grid (tiles exactly).
        ctx.strokeStyle = "rgba(160,140,255,0.12)";
        ctx.lineWidth = 3;
        const r = rng(51);
        for (let k = 0; k < 70; k++) {
          const x = Math.floor(r() * 16) * 64;
          const y = Math.floor(r() * 16) * 64;
          const len = (1 + Math.floor(r() * 3)) * 64;
          const horiz = r() > 0.5;
          wrapped(ctx, x, y, len + 10, (c) => {
            c.beginPath();
            c.moveTo(0, 0);
            c.lineTo(horiz ? len : 0, horiz ? 0 : len);
            c.stroke();
            c.fillStyle = "rgba(160,140,255,0.22)";
            c.beginPath();
            c.arc(horiz ? len : 0, horiz ? 0 : len, 5, 0, Math.PI * 2);
            c.fill();
          });
        }
        const bots = [botBox, botHover, botLens];
        for (let j = 0; j < 4; j++) {
          for (let i = 0; i < 4; i++) {
            const x = i * 256 + (j % 2) * 128 + 64;
            const y = j * 256 + 96;
            const tilt = (((i * 7 + j * 3) % 5) - 2) * 0.06;
            wrapped(ctx, x, y, 90, (c) => {
              c.rotate(tilt);
              bots[(i + j * 2) % 3](c);
            });
            wrapped(ctx, x + 128, y + 120, 24, (c) => {
              c.rotate(i + j);
              gear(c, 11, ["#ffcf5a", "#4dd4ff", "#ff9f43"][(i + j) % 3]);
            });
          }
        }
        starfield(ctx, rng(52), 90, ["#ffe9b8", "#d4f3ff"]);
      }

      const SKINS = {
        armada_fighters: paintFighters,
        armada_cruisers: paintCruisers,
        armada_nebula: paintNebula,
        armada_insignia: paintInsignia,
        armada_robots: paintRobots,
      };

      window.renderSkins = () => {
        const out = {};
        const host = document.getElementById("out");
        host.innerHTML = "";
        for (const [name, paint] of Object.entries(SKINS)) {
          const canvas = document.createElement("canvas");
          canvas.width = S;
          canvas.height = S;
          const ctx = canvas.getContext("2d");
          paint(ctx);
          out[name] = canvas.toDataURL("image/png");
          const fig = document.createElement("figure");
          const a = document.createElement("a");
          a.href = out[name];
          a.download = `${name}.png`;
          a.textContent = `${name}.png`;
          fig.append(canvas, a);
          host.append(fig);
        }
        return out;
      };
      window.renderSkins();
    </script>
  </body>
</html>
